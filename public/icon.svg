<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="table" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#0f544c" />
      <stop offset="55%" stop-color="#0b423d" />
      <stop offset="100%" stop-color="#07322f" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0bd77" />
      <stop offset="100%" stop-color="#a97f31" />
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6e4" />
      <stop offset="100%" stop-color="#f1e2be" />
    </linearGradient>
  </defs>

  <!-- table background, full bleed -->
  <rect width="512" height="512" fill="url(#table)" />

  <!-- subtle felt grid -->
  <g stroke="#8ec9c2" stroke-width="1" opacity="0.14">
    <path d="M0,64 H512 M0,128 H512 M0,192 H512 M0,256 H512 M0,320 H512 M0,384 H512 M0,448 H512" />
    <path d="M64,0 V512 M128,0 V512 M192,0 V512 M256,0 V512 M320,0 V512 M384,0 V512 M448,0 V512" />
  </g>

  <!-- vignette -->
  <rect width="512" height="512" fill="black" opacity="0.001" />
  <rect width="512" height="512" fill="url(#table)" opacity="0" />

  <!-- gold medallion -->
  <circle cx="256" cy="256" r="196" fill="url(#cream)" stroke="#b88a3d" stroke-width="10" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" />
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#gold)" stroke-width="6" />

  <!-- coral "7", centered in the medallion -->
  <text
    x="256"
    y="350"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Arial Black', Arial, Helvetica, sans-serif"
    font-weight="900"
    font-size="300"
    fill="#c94a37"
    stroke="#8f2c1f"
    stroke-width="6"
    paint-order="stroke fill"
  >7</text>
</svg>
